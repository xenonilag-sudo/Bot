    <script>
        // Language routing (the site is static, no server code):
        // a browser with no Vietnamese among its languages goes to
        // /en/, unless the visitor already picked a language (lang cookie).

        try {
            if (
                !/(?:^|;\s*)lang=/.test(document.cookie) &&
                !(navigator.languages || [navigator.language]).some(function (l) {
                    return /^vi\b/i.test(l);
                })
            ) {
                location.replace('/en/' + location.hash);
            }
        } catch (e) {}
    </script>
